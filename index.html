<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jacory</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { margin: 0; background: #0f141b; color: #e7edf3; }
    main { max-width: 720px; margin: 0 auto; padding: 12vh 24px; }
    img { width: 72px; height: 72px; }
    h1 { margin: 24px 0 12px; font-size: 32px; }
    p { color: #a9b6c3; line-height: 1.7; }
    code { padding: 4px 8px; border-radius: 6px; background: #202a35; color: #7ee5cc; word-break: break-all; }
    .note { margin-top: 32px; padding: 16px; border-left: 3px solid #24c8a5; background: #172029; }
  </style>
</head>
<body>
  <main>
    <img src="assets/icon.svg" alt="仓库图标">
    <h1>jacory</h1>
    <p>这是一个面向 iOS 17 roothide 环境的个人 APT 源。将兼容的 Debian 软件包放入 <code>debs/</code> 后推送，索引会由 GitHub Actions 自动生成。</p>
    <div class="note"><strong>添加源</strong><br><br><code id="source-url">https://USERNAME.github.io/REPOSITORY/</code></div>
  </main>
  <script>
    const path = location.pathname.replace(/\/$/, '');
    document.getElementById('source-url').textContent = `${location.origin}${path}/`;
  </script>
</body>
</html>
